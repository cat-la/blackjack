        // 計算幾何年化報酬率的輔助函數
        function calculateCAGR(basePrice, finalPrice, days) {
            if (days <= 0 || !basePrice || !finalPrice) return 0;
            return (Math.pow((finalPrice / basePrice), (365 / days)) - 1) * 100;
        }
        
        function runAnalysis() {
            const startTarget = document.getElementById('startDate').value;
            const endTarget = document.getElementById('endDate').value;
            
            if (startTarget >= endTarget) {
                alert('起始日期必須早於結束日期！');
                return;
            }
            
            // 篩選時間區間
            let filteredData = rawRecords.filter(item => item.date >= startTarget && item.date <= endTarget);
            if (filteredData.length < 2) {
                alert('該區間交易日不足！');
                return;
            }
            
            // 計算實際經過的天數 (用於年化報酬率)
            const diffDays = Math.ceil(Math.abs(new Date(filteredData[filteredData.length - 1].date) - new Date(filteredData[0].date)) / (1000 * 60 * 60 * 24));
            
            // 尋找三檔標的在「選定起始日(或該標的之後第一個有效交易日)」的各自初始基期價格
            let basePrices = { '0050': null, '0056': null, '00631L': null };
            let finalPrices = { '0050': null, '0056': null, '00631L': null };

            for (let k of ['0050', '0056', '00631L']) {

                if (k === '0050' && startTarget < '2014-01-02') continue;
                if (k === '00631L' && startTarget < '2015-01-06') continue;
                
                let firstValid = filteredData.find(item => item[k] !== null);
                if (firstValid) basePrices[k] = firstValid[k];
                
                let lastValid = [...filteredData].reverse().find(item => item[k] !== null);
                if (lastValid) finalPrices[k] = lastValid[k];
            }
            
            let labels = [];
            let data0050 = [];
            let data0056 = [];
            let data00631l = [];
            
            // 建立每日累積報酬率序列
            for (let i = 0; i < filteredData.length; i++) {
                const item = filteredData[i];
                labels.push(item.date);
                
                // 0050
                if (basePrices['0050'] && item['0050'] !== null && item.date >= '2014-01-02') {
                    data0050.push(((item['0050'] - basePrices['0050']) / basePrices['0050']) * 100);
                } else { data0050.push(null); }
                
                // 0056
                if (basePrices['0056'] && item['0056'] !== null) {
                    data0056.push(((item['0056'] - basePrices['0056']) / basePrices['0056']) * 100);

                // 00631L (限制 2015-01-06 之後以防 Bug)
                if (basePrices['00631L'] && item['00631L'] !== null && item.date >= '2015-01-06') {
                    data00631l.push(((item['00631L'] - basePrices['00631L']) / basePrices['00631L']) * 100);
                } else { data00631l.push(null); }
            }
            
            // 更新三大數據看板
            const updateStatUI = (prefix, base, final) => {
                const cumEl = document.getElementById(prefix + '_cum');
                const cagrEl = document.getElementById(prefix + '_cagr');
                if (base && final) {
                    const totalRet = ((final - base) / base) * 100;
                    const cagrRet = calculateCAGR(base, final, diffDays);
                    cumEl.innerText = `${totalRet >= 0 ? '+' : ''}${totalRet.toFixed(2)}%`;
                    cagrEl.innerText = `${cagrRet >= 0 ? '+' : ''}${cagrRet.toFixed(2)}% /年`;
                } else {
                    cumEl.innerText = '未達起始限制日';
                    cagrEl.innerText = '無法計算';
                }
            };
            
            updateStatUI('r0050', basePrices['0050'], finalPrices['0050']);
            updateStatUI('r0056', basePrices['0056'], finalPrices['0056']);
            updateStatUI('r00631l', basePrices['00631L'], finalPrices['00631L']);
            
            // 重新渲染整合型 Chart.js
            if (chartInstance) { chartInstance.destroy(); }
            const ctx = document.getElementById('compChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
