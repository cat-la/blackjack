        // 初始化日期邊界與預設值
        const firstAvailableDate = rawRecords[0].date;
        const lastAvailableDate = rawRecords[rawRecords.length - 1].date;
        
        document.getElementById('startDate').min = firstAvailableDate;
        document.getElementById('endDate').max = lastAvailableDate;
        document.getElementById('endDate').value = lastAvailableDate;
        
        let chartInstance = null;
        
        function runAnalysis() {
            const startTarget = document.getElementById('startDate').value;
            const endTarget = document.getElementById('endDate').value;
            
            if (startTarget < firstAvailableDate) {
                alert('起始日期不得早於 2015-01-06！');
                document.getElementById('startDate').value = firstAvailableDate;
                return;
            }
            
            if (startTarget >= endTarget) {
                alert('起始日期必須早於結束日期！');
                return;
            }
            
            // 根據自訂區間篩選數據
            let filteredData = rawRecords.filter(item => item.date >= startTarget && item.date <= endTarget);
            
            if (filteredData.length < 2) {
                alert('此區間內的交易日數據不足！');
                return;
            }
            
            // 【動態基準量化】以選定區間第一天的真實股價為黃金起點重新行走
            const initialPrice = filteredData[0].real_price;
            let theoPrice = initialPrice;
            
            let labels = [];
            let ratios = [];
            
            labels.push(filteredData[0].date);
            ratios.push(1.0); // 起跑當天實際等於理論，比值絕對是 1.0
            
            for (let i = 1; i < filteredData.length; i++) {
                const prevMkt = filteredData[i-1].mkt_close;
                const currMkt = filteredData[i].mkt_close;
                
                const mktDailyRet = (currMkt - prevMkt) / prevMkt;
                const theoDailyRet = mktDailyRet * 2;
                
                theoPrice = theoPrice * (1 + theoDailyRet);
                let currentRatio = filteredData[i].real_price / theoPrice;
                
                labels.push(filteredData[i].date);
                ratios.push(currentRatio);
            }
            
            // 更新儀表板數據
            document.getElementById('statStartPrice').innerText = `$${initialPrice.toFixed(2)}`;
            document.getElementById('statTheoPrice').innerText = `$${theoPrice.toFixed(2)}`;
            document.getElementById('statRealPrice').innerText = `$${filteredData[filteredData.length - 1].real_price.toFixed(2)}`;
            
            const finalRatio = filteredData[filteredData.length - 1].real_price / theoPrice;
            document.getElementById('statRatio').innerText = `${finalRatio.toFixed(4)} 倍`;
            
            // 重新繪製 Chart.js
            if (chartInstance) { chartInstance.destroy(); }
            const ctx = document.getElementById('ratioChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '股價比值 (選定區間實際股價 ÷ 理論含息2倍股價)',
                        data: ratios,
                        borderColor: '#34d399',
                        borderWidth: 2,
                        pointRadius: 0,
                        hoverRadius: 4,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#d1d5db' } } },
                    scales: {
                        x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af', maxTicksLimit: 12 } },

                    }
                }
            });
        }
        
        // 預設執行
        runAnalysis();
