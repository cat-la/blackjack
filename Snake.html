<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貪食蛇遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 確保在手機上點擊按鈕時不會出現預設的反白效果 */
        button {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        /* 隱藏捲軸，避免方向鍵操作時滑動頁面 */
        body {
            overflow: hidden;
            background-color: #1a202c;
            color: #e2e8f0;
        }
        canvas {
            background-color: #2d3748;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen pt-4 sm:pt-10 font-sans">

    <!-- 遊戲資訊與標題 -->
    <div class="w-full max-w-[400px] px-4 mb-2">
        <h1 class="text-2xl font-bold text-center text-green-400 mb-2">經典貪食蛇</h1>
        
        <div class="flex justify-between items-end bg-gray-800 p-3 rounded-lg shadow-md border border-gray-700">
            <div>
                <p class="text-sm text-gray-400">分數 <span id="score" class="text-xl font-bold text-white ml-1">0</span></p>
                <p class="text-sm text-gray-400 mt-1">等級 <span id="level" class="text-lg font-bold text-yellow-400 ml-1">1</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-red-400 font-semibold mb-1">最高等級為 LV.10</p>
                <p class="text-sm text-gray-400">閒置升級倒數: <span id="timer" class="text-lg font-bold text-blue-400">20s</span></p>
            </div>
        </div>
    </div>

    <!-- 遊戲畫布容器 -->
    <div class="relative w-full max-w-[400px] px-4">
        <!-- 畫布 -->
        <canvas id="gameCanvas" width="400" height="400" class="w-full aspect-square rounded-lg border-2 border-gray-600"></canvas>
        
        <!-- 狀態疊加層 (開始/結束提示) -->
        <div id="overlay" class="absolute inset-0 top-0 left-4 right-4 bottom-0 bg-black bg-opacity-70 flex flex-col items-center justify-center rounded-lg">
            <h2 id="overlay-title" class="text-3xl font-bold text-white mb-4">準備開始</h2>
            <p id="overlay-desc" class="text-gray-300 text-center mb-6 px-4">使用鍵盤 <span class="font-bold text-yellow-400">空白鍵</span><br>或點擊下方按鈕開始遊戲</p>
            <button id="btn-start" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg active:scale-95 transition-transform">
                開始遊戲
            </button>
        </div>
    </div>

    <!-- 手機操作介面設定 -->
    <div class="w-full mt-4 px-4 max-w-[400px]">
        <div class="flex justify-between items-center bg-gray-800 rounded-lg p-2 mb-2 text-sm">
            <span class="text-gray-300 ml-2">單手操作佈局：</span>
            <div class="flex space-x-1">
                <button onclick="setPadAlign('start')" id="align-left" class="px-3 py-1 bg-gray-600 rounded text-white active:bg-gray-500">靠左</button>
                <button onclick="setPadAlign('center')" id="align-center" class="px-3 py-1 bg-blue-600 rounded text-white active:bg-blue-500">置中</button>
                <button onclick="setPadAlign('end')" id="align-right" class="px-3 py-1 bg-gray-600 rounded text-white active:bg-gray-500">靠右</button>
            </div>
        </div>
    </div>

    <!-- 虛擬方向鍵 (D-Pad) -->
    <!-- 預設置中，寬度佔據 2/3 以方便單手操作 -->
    <div id="dpad-wrapper" class="w-full flex justify-center px-4 transition-all duration-300">
        <div class="w-2/3 max-w-[250px] grid grid-cols-3 gap-2">
            <div></div> <!-- 空白佔位 -->
            <button id="btn-up" class="bg-gray-700 active:bg-gray-500 rounded-xl aspect-square flex items-center justify-center text-3xl shadow-lg border-b-4 border-gray-900 pb-1">⬆️</button>
            <div></div> <!-- 空白佔位 -->
            
            <button id="btn-left" class="bg-gray-700 active:bg-gray-500 rounded-xl aspect-square flex items-center justify-center text-3xl shadow-lg border-b-4 border-gray-900 pb-1">⬅️</button>
            <button id="btn-down" class="bg-gray-700 active:bg-gray-500 rounded-xl aspect-square flex items-center justify-center text-3xl shadow-lg border-b-4 border-gray-900 pb-1">⬇️</button>
            <button id="btn-right" class="bg-gray-700 active:bg-gray-500 rounded-xl aspect-square flex items-center justify-center text-3xl shadow-lg border-b-4 border-gray-900 pb-1">➡️</button>
        </div>
    </div>

    <script>
        // --- 遊戲常數與變數設定 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const GRID_SIZE = 20; // 20x20 格子
        const TILE_COUNT = 20;
        const TILE_SIZE = canvas.width / TILE_COUNT;
        
        // 速度設定陣列 (LV.1 ~ LV.10 的延遲毫秒數，數字越小越快)
        // 起始 250ms (不會太慢)，極限 65ms (具挑戰性但不會快到無法反應)
        const SPEEDS = [250, 225, 200, 175, 150, 130, 110, 95, 80, 65];
        const MAX_LEVEL = 10;
        const IDLE_TIME_LIMIT = 20; // 20秒沒吃東西強制升級

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 0;
        let dy = 0;
        
        // 輸入佇列，用來防止玩家快速連續按鍵導致蛇頭咬到蛇頸的 Bug
        let inputQueue = []; 

        let score = 0;
        let level = 1;
        let foodsEatenThisLevel = 0;
        
        let status = 'ready'; // ready, playing, gameover
        let gameLoopTimer = null;
        let lastEatTime = 0;
        let uiUpdateTimer = null;

        // --- DOM 元素參照 ---
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const timerEl = document.getElementById('timer');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const btnStart = document.getElementById('btn-start');

        // --- 初始化與重置遊戲 ---
        function initGame() {
            // 蛇的初始位置 (置中，長度 3，往上移動)
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            dx = 0;
            dy = -1;
            inputQueue = [];
            
            score = 0;
            level = 1;
            foodsEatenThisLevel = 0;
            
            updateUI();
            placeFood();
            draw();
        }

        // --- 放置食物 ---
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                // 確保食物不會產生在蛇的身體上
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
        }

        // --- 遊戲主要邏輯更新 ---
        function update() {
            if (status !== 'playing') return;

            // 處理玩家輸入 (從佇列中取出下一個有效方向)
            if (inputQueue.length > 0) {
                const nextDir = inputQueue.shift();
                // 確保不能直接180度回轉
                if (nextDir.dx !== -dx || nextDir.dy !== -dy) {
                    dx = nextDir.dx;
                    dy = nextDir.dy;
                }
            }

            // 計算新蛇頭位置
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 檢查撞牆判定
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 檢查是否咬到自己
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            // 將新蛇頭加入陣列最前方
            snake.unshift(head);

            // 檢查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score++;
                foodsEatenThisLevel++;
                lastEatTime = Date.now(); // 重置閒置計時器

                // 每吃 3 個食物提升一個等級 (上限為 LV.10)
                if (foodsEatenThisLevel >= 3) {
                    levelUp();
                    foodsEatenThisLevel = 0;
                }
                
                updateUI();
                placeFood();
            } else {
                // 沒吃到食物，移除蛇尾巴，保持長度
                snake.pop();
            }
        }

        // --- 處理等級提升 ---
        function levelUp() {
            if (level < MAX_LEVEL) {
                level++;
                updateUI();
            }
        }

        // --- 繪製畫面 ---
        function draw() {
            // 清空畫布
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製格線 (增加視覺質感)
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 0.5;
            for(let i = 0; i <= TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_SIZE);
                ctx.lineTo(canvas.width, i * TILE_SIZE);
                ctx.stroke();
            }

            // 繪製食物 (蘋果)
            ctx.fillStyle = '#f56565';
            ctx.beginPath();
            ctx.arc(food.x * TILE_SIZE + TILE_SIZE/2, food.y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 繪製蛇
            snake.forEach((segment, index) => {
                // 蛇頭顏色較亮，身體較暗
                ctx.fillStyle = index === 0 ? '#48bb78' : '#38a169';
                
                // 為了視覺好看，格子留一點縫隙
                ctx.fillRect(
                    segment.x * TILE_SIZE + 1, 
                    segment.y * TILE_SIZE + 1, 
                    TILE_SIZE - 2, 
                    TILE_SIZE - 2
                );
            });
        }

        // --- 更新介面文字 ---
        function updateUI() {
            scoreEl.innerText = score;
            levelEl.innerText = level;
        }

        // --- 20秒防拖延計時器邏輯 ---
        function checkTimer() {
            if (status !== 'playing') return;

            const now = Date.now();
            const elapsedSeconds = Math.floor((now - lastEatTime) / 1000);
            let remaining = IDLE_TIME_LIMIT - elapsedSeconds;

            // 若達到 20 秒且未達最高等級，強制升級
            if (remaining <= 0) {
                if (level < MAX_LEVEL) {
                    levelUp();
                    foodsEatenThisLevel = 0; // 重置該等級的食物計數
                }
                lastEatTime = now; // 重新開始計時
                remaining = IDLE_TIME_LIMIT;
            }

            // 如果已經是最高等級，顯示 "MAX"
            if (level >= MAX_LEVEL) {
                timerEl.innerText = "MAX";
                timerEl.className = "text-lg font-bold text-red-500";
            } else {
                timerEl.innerText = remaining + "s";
                // 剩下 5 秒內改變顏色警告
                timerEl.className = remaining <= 5 
                    ? "text-lg font-bold text-red-500" 
                    : "text-lg font-bold text-blue-400";
            }
        }

        // --- 遊戲主迴圈 (使用 setTimeout 以支援動態改變速度) ---
        function gameLoop() {
            if (status === 'playing') {
                update();
                draw();
                
                // 依照目前等級取得對應的速度延遲
                const currentDelay = SPEEDS[level - 1];
                gameLoopTimer = setTimeout(gameLoop, currentDelay);
            }
        }

        // --- 定時更新 UI (主要是倒數計時) ---
        function uiLoop() {
            if (status === 'playing') {
                checkTimer();
            }
            uiUpdateTimer = requestAnimationFrame(uiLoop);
        }

        // --- 遊戲狀態控制 ---
        function startGame() {
            if (status === 'playing') return;
            
            initGame();
            status = 'playing';
            overlay.classList.add('hidden');
            lastEatTime = Date.now();
            
            // 啟動迴圈
            clearTimeout(gameLoopTimer);
            cancelAnimationFrame(uiUpdateTimer);
            gameLoop();
            uiLoop();
        }

        function gameOver() {
            status = 'gameover';
            clearTimeout(gameLoopTimer);
            cancelAnimationFrame(uiUpdateTimer);
            
            overlayTitle.innerText = "挑戰失敗";
            overlayTitle.className = "text-3xl font-bold text-red-500 mb-4";
            overlay.classList.remove('hidden');
        }

        // --- 處理方向輸入 ---
        function handleInput(newDx, newDy) {
            if (status !== 'playing') return;
            
            // 取得目前佇列最後一個方向，或是蛇目前的方向
            const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : { dx, dy };
            
            // 避免反向移動
            if (lastDir.dx !== -newDx && lastDir.dy !== -newDy) {
                // 防止過度輸入累積（最多允許緩存兩個轉彎動作）
                if (inputQueue.length < 2) {
                    inputQueue.push({ dx: newDx, dy: newDy });
                }
            }
        }

        // --- 鍵盤事件監聽 ---
        window.addEventListener('keydown', (e) => {
            // 防止方向鍵和空白鍵捲動網頁
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
                e.preventDefault();
            }

            if (e.code === 'Space') {
                if (status === 'ready' || status === 'gameover') {
                    startGame();
                }
            } else if (e.code === 'ArrowUp') {
                handleInput(0, -1);
            } else if (e.code === 'ArrowDown') {
                handleInput(0, 1);
            } else if (e.code === 'ArrowLeft') {
                handleInput(-1, 0);
            } else if (e.code === 'ArrowRight') {
                handleInput(1, 0);
            }
        });

        // --- 畫面按鈕事件監聽 ---
        btnStart.addEventListener('click', startGame);
        document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.preventDefault(); handleInput(0, -1); });
        document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); handleInput(0, 1); });
        document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); handleInput(-1, 0); });
        document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); handleInput(1, 0); });

        // --- 單手操作佈局切換 (左/中/右) ---
        function setPadAlign(align) {
            const wrapper = document.getElementById('dpad-wrapper');
            const btns = {
                'start': document.getElementById('align-left'),
                'center': document.getElementById('align-center'),
                'end': document.getElementById('align-right')
            };

            // 重置對齊 class
            wrapper.classList.remove('justify-start', 'justify-center', 'justify-end');
            wrapper.classList.add(`justify-${align}`);

            // 更新按鈕外觀
            Object.keys(btns).forEach(key => {
                if (key === align) {
                    btns[key].classList.replace('bg-gray-600', 'bg-blue-600');
                } else {
                    btns[key].classList.replace('bg-blue-600', 'bg-gray-600');
                }
            });
        }

        // 初始化繪製空畫面
        initGame();
        status = 'ready'; // 覆寫 initGame 中預設的狀態確保在開始前凍結

    </script>
</body>
</html>
